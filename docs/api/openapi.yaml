              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "chunk_type",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "text",
                "table",
                "header",
                "list",
                "image",
                "unknown"
              ]
            }
          },
          {
            "name": "page_number",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          },
          {
            "name": "retrieval_role",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "parent",
                "child",
                "both"
              ]
            }
          },
          {
            "name": "section",
            "in": "query",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 255
