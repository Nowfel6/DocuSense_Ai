        "parameters": [
          {
            "name": "format",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "csv",
                "xlsx",
                "json"
              ]
            }
          },
          {
            "name": "document_id",
            "in": "query",
            "required": false,
            "style": "form",
            "explode": true,
            "schema": {
              "type": "array",
              "items": {
                "type": "string",
                "format": "uuid"
              },
              "minItems": 1,
              "maxItems": 500,
              "uniqueItems": true
            }
          },
          {
            "name": "document_statuses",
            "in": "query",
            "required": false,
            "style": "form",
            "explode": true,
            "schema": {
              "type": "array",
              "items": {
                "type": "string",
                "enum": [
                  "pending_review",
                  "approved",
                  "rejected"
                ]
              },
              "minItems": 1,
              "maxItems": 3,
              "uniqueItems": true
            }
          },
          {
            "name": "document_type",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "commercial_invoice",
                "purchase_order",
                "packing_list"
              ]
            }
          },
          {
            "name": "supplier",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 255
            }
          },
          {
            "name": "currency",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^[A-Z]{3}$"
            }
          },
          {
            "name": "invoice_date_from",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "invoice_date_to",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "uploaded_from",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "uploaded_to",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "min_total",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^(?:0|[0-9]+)(?:\\.[0-9]{1,2})?$"
            }
          },
          {
            "name": "max_total",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^(?:0|[0-9]+)(?:\\.[0-9]{1,2})?$"
            }
          },
          {
            "name": "sort_by",
            "in": "query",
            "required": false,
            "description": "relevance is invalid because this route accepts no semantic query.",
            "schema": {
              "type": "string",
              "enum": [
                "relevance",
                "date_issued",
                "grand_total",
                "created_at"
              ]
            }
          },
          {
            "name": "order",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "asc",
                "desc"
              ],
              "default": "desc"
            }
          }
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ]
      }
    },
