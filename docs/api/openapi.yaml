    "/api/v1/documents/export": {
      "get": {
        "tags": [
          "document-search-export"
        ],
        "summary": "Direct Export",
        "operationId": "direct_export_api_v1_documents_export_get",
        "responses": {
          "200": {
            "description": "Synchronous private export artifact.",
            "headers": {
              "Cache-Control": {
                "description": "Private response that must not be cached.",
                "schema": {
                  "type": "string"
                }
              },
              "Pragma": {
                "description": "Legacy no-cache directive.",
                "schema": {
                  "type": "string"
                }
              },
              "X-Content-Type-Options": {
                "description": "MIME sniffing is disabled.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "nosniff"
                  ]
                }
              },
              "Content-Disposition": {
                "description": "Safe attachment filename.",
                "schema": {
                  "type": "string"
                }
              },
              "X-Content-SHA256": {
                "description": "Lowercase SHA-256 checksum of the returned artifact.",
                "schema": {
                  "type": "string",
                  "pattern": "^[0-9a-f]{64}$"
                }
              },
              "X-Export-Id": {
                "description": "Durable export resource created for this direct download.",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "content": {
              "text/csv": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              },
              "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              },
              "application/json": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
