    "/api/v1/documents/{document_id}/extraction-evidence": {
      "get": {
        "tags": [
          "documents"
        ],
        "summary": "Evidence",
        "operationId": "evidence_api_v1_documents__document_id__extraction_evidence_get",
        "parameters": [
          {
            "name": "document_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Document Id"
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          },
          {
            "name": "page_size",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "field_path",
            "in": "query",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 255,
              "pattern": "^[a-z][a-z0-9_]*(?:\\.[A-Za-z0-9_-]+)+$"
