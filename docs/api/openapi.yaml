    "/api/v1/documents/upload": {
      "post": {
        "tags": [
          "documents"
        ],
        "summary": "Upload",
        "operationId": "upload_api_v1_documents_upload_post",
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary"
                  },
                  "doc_type_hint": {
                    "type": "string",
                    "enum": [
                      "commercial_invoice",
                      "purchase_order",
                      "packing_list",
                      "invoice",
                      "po"
                    ],
                    "default": "commercial_invoice"
                  },
                  "confirm_duplicate": {
                    "type": "boolean",
                    "default": false
                  }
                },
                "additionalProperties": false,
                "type": "object",
                "required": [
                  "file"
                ]
              }
            }
          },
          "required": true
        },
        "responses": {
          "202": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Success_UploadAccepted_"
                }
              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          },
          {
            "ApiKeyAuth": []
          }
        ]
      }
    },
