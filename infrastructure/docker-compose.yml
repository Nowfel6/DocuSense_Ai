# DocuSense AI — local development services (PostgreSQL + pgvector, Redis, MinIO).
#
# Run from final_project/ so relative paths resolve identically for everyone:
#
#   .\backend\.venv\Scripts\python.exe infrastructure\foundation.py up
#
# Direct Compose equivalent (never print resolved Compose output; it contains
# secrets):
#
#   docker compose --env-file .env -f infrastructure/docker-compose.yml up -d --build
#
# All host ports bind to loopback only. Named volumes persist data across
# `down`; shutdown never deletes them. Do not publish the MinIO console port.

name: docusense-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docusense-local-postgres-1
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55465}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: docusense-local-redis-1
    restart: unless-stopped
    env_file: ../.env
    # Password comes from REDIS_PASSWORD in ../.env (injected by env_file).
    entrypoint: ["/bin/sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    # Built from the pinned final security release of the archived community
    # MinIO source; see infrastructure/minio/Dockerfile. The first `up` after a
    # clone compiles the image and takes substantially longer.
    image: docusense-local-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: minio.Dockerfile
    container_name: docusense-local-minio-1
    restart: unless-stopped
    env_file: ../.env
    entrypoint: ["/bin/sh", "-c", "exec minio server --address :9000 /data"]
    ports:
      # Loopback HTTPS only; the console (container port 9001) is not published.
      - "127.0.0.1:${S3_PORT:-39500}:9000"
    volumes:
      - minio-data:/data
      - ./local/certs:/certs:ro
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
      MINIO_CERTS_DIR: /certs
      # The S3 API is reached as https://localhost:<S3_PORT> from the host, so
      # server-generated (e.g. presigned download) URLs must target that origin.
      MINIO_SERVER_URL: https://localhost:${S3_PORT:-39500}
    healthcheck:
      test: ["CMD-SHELL", "curl --cacert /certs/public.crt -fsS https://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
  minio-data:
