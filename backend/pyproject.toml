# Reviewed ingestion runtime pins are preserved. Foundation tools are optional.
# Missing auth/repository/worker implementations remain tracked in issue_missing.md.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docusense-backend"
version = "0.1.0"
description = "DocuSense backend feature modules"
requires-python = ">=3.11"
dependencies = [
    "aiobotocore==3.9.0",
    "alembic==1.19.1",
    "argon2-cffi==25.1.0",
    "celery[redis]==5.6.3",
    "docling[easyocr]==2.126.0",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "groq==1.7.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyJWT==2.13.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "redis==6.4.0",
    "sentence-transformers==6.0.1",
    "SQLAlchemy==2.0.52",
    "starlette==1.6.0",
    "uvicorn==0.41.0",
]

[project.optional-dependencies]
foundation = [
    "cryptography>=44,<47",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<8",
    "uvicorn>=0.34,<1",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
