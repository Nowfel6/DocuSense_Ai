[alembic]
script_location = %(here)s/alembic
version_locations = %(here)s/auth/migrations;%(here)s/document_ingestion/migrations;%(here)s/document_processing_rag/migrations;%(here)s/human_review_audit/migrations;%(here)s/document_search_export/migrations
version_path_separator = os
sqlalchemy.url = postgresql://placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
